server:
  port: 8092

spring:
  application:
    name: ai-service

gemini:
  api:
    key: ${GEMINI_API_KEY}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true