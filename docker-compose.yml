version: '3.8'

networks:
  ecommerce-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  es-data:

services:
  # ==========================================
  # INFRASTRUCTURE SERVICES
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ecommerce-net

  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ecommerce-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ecommerce-net

  # ==========================================
  # CORE & BUSINESS MICROSERVICES
  # ==========================================
  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - ecommerce-net

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    networks:
      - ecommerce-net

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    networks:
      - ecommerce-net

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - mysql
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_HOST=mysql
      - DB_PORT=3306
    networks:
      - ecommerce-net

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/product-service
    container_name: product-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - mysql
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_HOST=mysql
      - DB_PORT=3306
    networks:
      - ecommerce-net

  cart-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/cart-service
    container_name: cart-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - redis
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
    networks:
      - ecommerce-net

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - mysql
      - kafka
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_HOST=mysql
      - DB_PORT=3306
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ecommerce-net

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/order-service
    container_name: order-service
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - mysql
      - kafka
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_HOST=mysql
      - DB_PORT=3306
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ecommerce-net

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/inventory-service
    container_name: inventory-service
    ports:
      - "8086:8086"
    depends_on:
      - eureka-server
      - mysql
      - kafka
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_HOST=mysql
      - DB_PORT=3306
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ecommerce-net

  shipping-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/shipping-service
    container_name: shipping-service
    ports:
      - "8087:8087"
    depends_on:
      - eureka-server
      - mysql
      - kafka
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_HOST=mysql
      - DB_PORT=3306
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ecommerce-net

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/notification-service
    container_name: notification-service
    ports:
      - "8088:8088"
    depends_on:
      - eureka-server
      - kafka
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - ecommerce-net

  review-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/review-service
    container_name: review-service
    ports:
      - "8089:8089"
    depends_on:
      - eureka-server
      - mysql
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_HOST=mysql
      - DB_PORT=3306
    networks:
      - ecommerce-net

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/user-service
    container_name: user-service
    ports:
      - "8090:8090"
    depends_on:
      - eureka-server
      - mysql
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_HOST=mysql
      - DB_PORT=3306
    networks:
      - ecommerce-net

  search-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/search-service
    container_name: search-service
    ports:
      - "8091:8091"
    depends_on:
      - eureka-server
      - elasticsearch
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - ELASTICSEARCH_URI=http://elasticsearch:9200
    networks:
      - ecommerce-net

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: backend/ai-service
    container_name: ai-service
    ports:
      - "8092:8092"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    networks:
      - ecommerce-net

  # ==========================================
  # MODERN FRONTEND SERVICE
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
    depends_on:
      - api-gateway
    networks:
      - ecommerce-net